    <!-- líneas de texto -->
    <g stroke="#4A6BBA" stroke-width="2.6" stroke-linecap="round" opacity="0.45">
      <path d="M-21 -10 C -15 -13 -9 -13 -5 -11"/>
      <path d="M-21 -2 C -15 -5 -9 -5 -5 -3"/>
      <path d="M-21 6 C -15 3 -9 3 -5 5"/>
      <path d="M5 -11 C 9 -13 15 -13 21 -10"/>
      <path d="M5 -3 C 9 -5 15 -5 21 -2"/>
      <path d="M5 5 C 9 3 15 3 21 6"/>
    </g>
    <!-- marcador dorado -->
    <path d="M10 -22 L 10 -4 L 16 -9 L 22 -4 L 22 -22 Z" fill="#D9A441"/>
  </g>
</svg>
